<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 280px; padding: 12px; font: 14px system-ui, sans-serif; }
      input, textarea, button { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 8px; font: inherit; }
      textarea { height: 96px; resize: vertical; }
      button { border: 0; border-radius: 4px; background: #0a66c2; color: #fff; cursor: pointer; }
      #status { font-size: 12px; }
    </style>
  </head>
  <body>
    <input id="linkedin" placeholder="username or profile URL" />
    <button id="scrape">Scrape LinkedIn Profile</button>
    <button id="apply">Apply to This Job Page</button>
    <textarea id="description" placeholder="or paste a job description"></textarea>
    <input id="link" placeholder="job link (optional)" />
    <button id="paste">Apply to Pasted Job</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
